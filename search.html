<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Search Results | SkyHigh Airlines</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">SkyHigh Airlines</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Book Flights</a></li>
                <li><a href="#">Manage Booking</a></li>
            </ul>
        </nav>
    </header>

    <main class="search-results-page">
        <aside class="filters">
            <h3>Filters</h3>
            <label><input type="checkbox"> Non-stop</label><br>
            <label><input type="checkbox"> Morning Departure</label><br>
            <label><input type="checkbox"> Premium Economy</label>
        </aside>
        <section class="results">
            <h2>Available Flights</h2>
            <div class="flight-card">
                <div class="flight-info">
                    <h4>SkyHigh Air (SH-402)</h4>
                    <p>08:00 AM - 11:30 AM (3h 30m)</p>
                    <p>Non-stop</p>
                </div>
                <div class="flight-price">
                    <h3>$299</h3>
                    <button class="btn-secondary" onclick="alert('Proceeding to Fare Details...')">Select</button>
                </div>
            </div>
            <div class="flight-card">
                <div class="flight-info">
                    <h4>SkyHigh Air (SH-505)</h4>
                    <p>02:00 PM - 05:45 PM (3h 45m)</p>
                    <p>Non-stop</p>
                </div>
                <div class="flight-price">
                    <h3>$349</h3>
                    <button class="btn-secondary" onclick="alert('Proceeding to Fare Details...')">Select</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SkyHigh Airlines. All rights reserved.</p>
    </footer>
</body>
</html>
