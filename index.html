<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyHigh Airlines | Home</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">SkyHigh Airlines</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="search.html">Book Flights</a></li>
                <li><a href="#">Manage Booking</a></li>
                <li><a href="#">Check-in</a></li>
                <li><a href="#">Flight Status</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-content">
            <h1>Explore the World with Us</h1>
            <p>Book your next adventure today.</p>
        </div>
    </section>

    <section class="search-widget">
        <h2>Search Flights</h2>
        <form action="search.html" method="GET">
            <div class="form-group">
                <label>From</label>
                <input type="text" placeholder="Origin City or Airport" required>
            </div>
            <div class="form-group">
                <label>To</label>
                <input type="text" placeholder="Destination City or Airport" required>
            </div>
            <div class="form-group">
                <label>Departure Date</label>
                <input type="date" required>
            </div>
            <div class="form-group">
                <label>Passengers</label>
                <input type="number" min="1" value="1" required>
            </div>
            <button type="submit" class="btn-primary">Search Flights</button>
        </form>
    </section>

    <section class="destinations">
        <h2>Popular Destinations</h2>
        <div class="dest-grid">
            <div class="dest-card"><img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=400&q=80" alt="Paris"><h3>Paris</h3></div>
            <div class="dest-card"><img src="https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?auto=format&fit=crop&w=400&q=80" alt="Sydney"><h3>Sydney</h3></div>
            <div class="dest-card"><img src="https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?auto=format&fit=crop&w=400&q=80" alt="Tokyo"><h3>Tokyo</h3></div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 SkyHigh Airlines. All rights reserved.</p>
    </footer>
</body>
</html>
