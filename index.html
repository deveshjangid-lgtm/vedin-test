<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyHigh Airlines | Book Your Flight</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">SkyHigh Airlines</div>
        <ul class="nav-links">
            <li><a href="index.html">Book</a></li>
            <li><a href="#">Manage Booking</a></li>
            <li><a href="#">Check-In</a></li>
            <li><a href="#">Flight Status</a></li>
        </ul>
    </nav>

    <header class="hero" style="background-image: url('https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=1920&q=80');">
        <div class="hero-content">
            <h1>Let's Explore the World</h1>
            <p>Book your next adventure today with premium comfort.</p>
        </div>
        
        <div class="search-widget">
            <form action="search.html" method="GET">
                <div class="form-group">
                    <label>From</label>
                    <input type="text" placeholder="Departure City (e.g., JFK)" required>
                </div>
                <div class="form-group">
                    <label>To</label>
                    <input type="text" placeholder="Arrival City (e.g., LHR)" required>
                </div>
                <div class="form-group">
                    <label>Departure Date</label>
                    <input type="date" required>
                </div>
                <div class="form-group">
                    <label>Passengers</label>
                    <input type="number" min="1" value="1" required>
                </div>
                <button type="submit" class="btn-primary">Search Flights</button>
            </form>
        </div>
    </header>

    <section class="destinations">
        <h2>Popular Destinations</h2>
        <div class="dest-grid">
            <div class="dest-card" style="background-image: url('https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=400&q=80');">
                <h3>Paris</h3>
            </div>
            <div class="dest-card" style="background-image: url('https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=400&q=80');">
                <h3>London</h3>
            </div>
            <div class="dest-card" style="background-image: url('https://images.unsplash.com/photo-1503899036084-c55cdd92da26?auto=format&fit=crop&w=400&q=80');">
                <h3>Tokyo</h3>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 SkyHigh Airlines. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
